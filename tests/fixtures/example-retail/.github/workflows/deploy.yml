name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy items to the production workspace
        run: ./scripts/deploy.sh "${{ vars.PROD_WORKSPACE }}"
        env:
          FABRIC_TOKEN: ${{ secrets.FABRIC_TOKEN }}
